name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Inject Supabase config (optional)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            sed -i "s|^export const SUPABASE_URL = '.*';|export const SUPABASE_URL = '$SUPABASE_URL';|" assets/js/config.js
            sed -i "s|^export const SUPABASE_ANON_KEY = '.*';|export const SUPABASE_ANON_KEY = '$SUPABASE_ANON_KEY';|" assets/js/config.js
            echo "Supabase mode"
          else
            echo "Local mode (no Supabase variables set)"
          fi
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html assets data .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
