<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리의 결혼 준비 2027.06.05</title>
<style>
  :root {
    --bg: #faf7f5; --panel: #ffffff; --text: #3b3234; --muted: #9a8e91;
    --accent: #c9868f; --groom: #6c8ebf; --bride: #d98b9a; --line: #ece4e2;
    --today: #f3e3e6; --wedding: #c9868f; --radius: 14px;
    --font: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  /* 시안 B: 모던 다크 */
  body.theme-b {
    --bg: #161619; --panel: #222227; --text: #f1eff2; --muted: #8a8790;
    --accent: #b9a3ff; --groom: #5fb0c9; --bride: #ff8fa3; --line: #34333a;
    --today: #33303d; --wedding: #b9a3ff;
  }
  /* 시안 C: 세이지 내추럴 */
  body.theme-c {
    --bg: #f3f5ef; --panel: #ffffff; --text: #33403a; --muted: #8b9790;
    --accent: #7d9a7f; --groom: #5b7fa6; --bride: #c58a6e; --line: #e2e7df;
    --today: #e8efe4; --wedding: #7d9a7f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 18px 28px; flex-wrap: wrap; gap: 12px; }
  header h1 { font-size: 20px; margin: 0; }
  header .dday { color: var(--accent); font-weight: 700; font-size: 14px; margin-top: 4px; }
  .theme-select select { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  .layout { display: grid; grid-template-columns: 1fr 380px; gap: 20px; padding: 0 28px 28px; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border-radius: var(--radius); padding: 20px; border: 1px solid var(--line); }

  /* 캘린더 */
  .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .cal-head h2 { margin: 0; font-size: 18px; }
  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.danger { color: #d05050; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .dow { text-align: center; font-size: 12px; color: var(--muted); padding: 6px 0; }
  .day { min-height: 84px; border: 1px solid var(--line); border-radius: 10px; padding: 6px; cursor: pointer; position: relative; background: var(--panel); }
  .day:hover { border-color: var(--accent); }
  .day.other { opacity: .35; }
  .day.today { background: var(--today); }
  .day.selected { outline: 2px solid var(--accent); }
  .day.wedding { background: var(--wedding); color: #fff; }
  .day.wedding .num { color: #fff; }
  .num { font-size: 13px; font-weight: 600; }
  .dots { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.groom { background: var(--groom); }
  .dot.bride { background: var(--bride); }
  .dot.done { opacity: .35; }
  .wedding-tag { font-size: 10px; margin-top: 4px; font-weight: 700; }

  /* 우측 패널 */
  .panel h2 { margin: 0 0 4px; font-size: 18px; }
  .panel .sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .filters { display: flex; gap: 6px; margin-bottom: 14px; }
  .filters button { flex: 1; }
  .filters button.active { background: var(--text); color: var(--panel); border-color: var(--text); }
  .form { display: grid; gap: 8px; padding: 14px; border: 1px dashed var(--line); border-radius: 10px; margin-bottom: 16px; }
  .form input, .form select, .form textarea {
    width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-family: inherit; font-size: 14px;
  }
  .form .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .form .actions { display: flex; gap: 6px; justify-content: flex-end; }
  .owner-toggle { display: flex; gap: 6px; }
  .owner-toggle label { flex: 1; text-align: center; padding: 8px; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; font-size: 14px; }
  .owner-toggle input { display: none; }
  .owner-toggle input:checked + span { font-weight: 700; }
  .owner-toggle label:has(input:checked) { border-color: var(--accent); background: var(--today); }

  .group-title { font-size: 13px; font-weight: 700; margin: 16px 0 8px; display: flex; align-items: center; gap: 6px; }
  .group-title i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .todo { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border-radius: 10px; border: 1px solid var(--line); margin-bottom: 8px; }
  .todo input[type=checkbox] { margin-top: 3px; accent-color: var(--accent); }
  .todo .body { flex: 1; min-width: 0; }
  .todo .title { font-size: 14px; word-break: break-word; }
  .todo.done .title { text-decoration: line-through; color: var(--muted); }
  .todo .meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .todo .tools { display: flex; flex-direction: column; gap: 4px; }
  .todo .tools button { font-size: 12px; padding: 4px 8px; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 18px 0; }
  .progress { height: 6px; background: var(--line); border-radius: 4px; overflow: hidden; margin-bottom: 6px; }
  .progress div { height: 100%; background: var(--accent); transition: width .3s; }
</style>
</head>
<body>
<header>
  <div>
    <h1>💍 우리의 결혼 준비</h1>
    <div class="dday" id="dday"></div>
  </div>
  <div class="theme-select">
    <select id="themeSelect" aria-label="디자인 시안">
      <option value="a">시안 A · 로즈 웨딩</option>
      <option value="b">시안 B · 모던 다크</option>
      <option value="c">시안 C · 세이지 내추럴</option>
    </select>
  </div>
</header>

<div class="layout">
  <!-- 캘린더 -->
  <section class="card">
    <div class="cal-head">
      <button class="btn" id="prev">‹ 이전</button>
      <h2 id="monthTitle"></h2>
      <div style="display:flex; gap:6px">
        <button class="btn" id="today">오늘</button>
        <button class="btn" id="next">다음 ›</button>
      </div>
    </div>
    <div class="grid" id="dowRow"></div>
    <div class="grid" id="calGrid"></div>
  </section>

  <!-- 우측 패널: 월별 todo -->
  <aside class="card panel">
    <h2 id="panelTitle"></h2>
    <div class="sub" id="panelSub"></div>
    <div class="progress"><div id="progressBar" style="width:0"></div></div>
    <div class="sub" id="progressText"></div>

    <div class="filters">
      <button class="btn active" data-filter="all">전체</button>
      <button class="btn" data-filter="groom">신랑</button>
      <button class="btn" data-filter="bride">신부</button>
    </div>

    <form class="form" id="todoForm">
      <input type="text" id="title" placeholder="할 일을 입력하세요 (예: 웨딩홀 계약금 입금)" required>
      <div class="owner-toggle">
        <label><input type="radio" name="owner" value="groom" checked><span>🤵 신랑 담당</span></label>
        <label><input type="radio" name="owner" value="bride"><span>👰 신부 담당</span></label>
      </div>
      <div class="row">
        <input type="date" id="date" required>
        <select id="priority">
          <option value="normal">보통</option>
          <option value="high">중요</option>
          <option value="low">여유</option>
        </select>
      </div>
      <textarea id="memo" rows="2" placeholder="메모 (선택)"></textarea>
      <div class="actions">
        <button type="button" class="btn" id="cancelEdit" style="display:none">취소</button>
        <button type="submit" class="btn primary" id="submitBtn">추가</button>
      </div>
    </form>

    <div id="todoList"></div>
  </aside>
</div>

<script>
(function () {
  const WEDDING = new Date(2027, 5, 5); // 2027-06-05
  const STORE_KEY = 'wedding-todos-v1';
  const DOW = ['일', '월', '화', '수', '목', '금', '토'];

  let todos = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
  let viewYear = new Date().getFullYear();
  let viewMonth = new Date().getMonth();
  let selectedDate = fmt(new Date());
  let filter = 'all';
  let editingId = null;

  const $ = (id) => document.getElementById(id);
  const save = () => localStorage.setItem(STORE_KEY, JSON.stringify(todos));
  function fmt(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  // D-day
  function renderDday() {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const diff = Math.round((WEDDING - today) / 86400000);
    $('dday').textContent = diff > 0 ? `웨딩데이까지 D-${diff}` : diff === 0 ? '오늘이 웨딩데이입니다! 💐' : `웨딩데이 D+${-diff}`;
  }

  // 캘린더
  function renderCalendar() {
    $('monthTitle').textContent = `${viewYear}년 ${viewMonth + 1}월`;
    $('dowRow').innerHTML = DOW.map(d => `<div class="dow">${d}</div>`).join('');
    const first = new Date(viewYear, viewMonth, 1);
    const start = new Date(viewYear, viewMonth, 1 - first.getDay());
    const todayStr = fmt(new Date());
    const weddingStr = fmt(WEDDING);
    let html = '';
    for (let i = 0; i < 42; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      const ds = fmt(d);
      const dayTodos = todos.filter(t => t.date === ds);
      const classes = ['day'];
      if (d.getMonth() !== viewMonth) classes.push('other');
      if (ds === todayStr) classes.push('today');
      if (ds === selectedDate) classes.push('selected');
      if (ds === weddingStr) classes.push('wedding');
      const dots = dayTodos.slice(0, 6).map(t => `<span class="dot ${t.owner}${t.done ? ' done' : ''}"></span>`).join('');
      html += `<div class="${classes.join(' ')}" data-date="${ds}">
        <div class="num">${d.getDate()}</div>
        ${ds === weddingStr ? '<div class="wedding-tag">💍 WEDDING</div>' : ''}
        <div class="dots">${dots}</div>
      </div>`;
    }
    $('calGrid').innerHTML = html;
  }

  // 우측 패널 (월별 todo)
  function renderPanel() {
    const monthPrefix = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}`;
    const monthTodos = todos.filter(t => t.date.startsWith(monthPrefix));
    const shown = monthTodos.filter(t => filter === 'all' || t.owner === filter);

    $('panelTitle').textContent = `${viewMonth + 1}월 할 일`;
    $('panelSub').textContent = `${selectedDate} 기준 · 이번 달 ${monthTodos.length}개`;

    const doneCount = monthTodos.filter(t => t.done).length;
    const pct = monthTodos.length ? Math.round(doneCount / monthTodos.length * 100) : 0;
    $('progressBar').style.width = pct + '%';
    $('progressText').textContent = `완료 ${doneCount} / ${monthTodos.length} (${pct}%)`;

    document.querySelectorAll('.filters button').forEach(b => b.classList.toggle('active', b.dataset.filter === filter));

    const groups = [
      { key: 'groom', label: '🤵 신랑 담당', color: 'var(--groom)' },
      { key: 'bride', label: '👰 신부 담당', color: 'var(--bride)' },
    ].filter(g => filter === 'all' || filter === g.key);

    if (!shown.length) {
      $('todoList').innerHTML = `<div class="empty">이번 달 할 일이 없습니다.<br>위 폼에서 추가해 보세요.</div>`;
      return;
    }

    $('todoList').innerHTML = groups.map(g => {
      const items = shown.filter(t => t.owner === g.key).sort((a, b) => a.date.localeCompare(b.date) || (a.done - b.done));
      if (!items.length) return '';
      return `<div class="group-title"><i style="background:${g.color}"></i>${g.label} (${items.length})</div>` +
        items.map(t => `
          <div class="todo ${t.done ? 'done' : ''}">
            <input type="checkbox" data-act="toggle" data-id="${t.id}" ${t.done ? 'checked' : ''}>
            <div class="body">
              <div class="title">${t.priority === 'high' ? '🔥 ' : ''}${escapeHtml(t.title)}</div>
              <div class="meta">📅 ${t.date}${t.memo ? ' · ' + escapeHtml(t.memo) : ''}</div>
            </div>
            <div class="tools">
              <button class="btn" data-act="edit" data-id="${t.id}">수정</button>
              <button class="btn danger" data-act="delete" data-id="${t.id}">삭제</button>
            </div>
          </div>`).join('');
    }).join('') || `<div class="empty">선택한 담당자의 할 일이 없습니다.</div>`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function renderAll() { renderDday(); renderCalendar(); renderPanel(); }

  // 폼: 생성 / 수정
  function resetForm() {
    editingId = null;
    $('todoForm').reset();
    $('date').value = selectedDate;
    $('submitBtn').textContent = '추가';
    $('cancelEdit').style.display = 'none';
  }

  $('todoForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const data = {
      title: $('title').value.trim(),
      owner: document.querySelector('input[name=owner]:checked').value,
      date: $('date').value,
      priority: $('priority').value,
      memo: $('memo').value.trim(),
    };
    if (!data.title || !data.date) return;

    if (editingId) {
      const t = todos.find(x => x.id === editingId);
      if (t) Object.assign(t, data);
    } else {
      todos.push({ id: uid(), done: false, ...data });
    }
    save();
    // 추가한 날짜가 다른 달이면 해당 달로 이동
    const d = new Date(data.date + 'T00:00:00');
    selectedDate = data.date;
    viewYear = d.getFullYear(); viewMonth = d.getMonth();
    resetForm();
    renderAll();
  });

  $('cancelEdit').addEventListener('click', resetForm);

  // 할 일 목록 액션 (이벤트 위임)
  $('todoList').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const id = btn.dataset.id;
    const t = todos.find(x => x.id === id);
    if (!t) return;
    const act = btn.dataset.act;

    if (act === 'delete') {
      if (!confirm('이 할 일을 삭제할까요?')) return;
      todos = todos.filter(x => x.id !== id);
      save();
      if (editingId === id) resetForm();
      renderAll();
    }
    if (act === 'edit') {
      editingId = id;
      $('title').value = t.title;
      document.querySelector(`input[name=owner][value=${t.owner}]`).checked = true;
      $('date').value = t.date;
      $('priority').value = t.priority;
      $('memo').value = t.memo || '';
      $('submitBtn').textContent = '저장';
      $('cancelEdit').style.display = '';
      $('title').focus();
    }
  });

  $('todoList').addEventListener('change', (e) => {
    if (e.target.dataset.act === 'toggle') {
      const t = todos.find(x => x.id === e.target.dataset.id);
      if (t) { t.done = e.target.checked; save(); renderAll(); }
    }
  });

  // 캘린더 상호작용
  $('calGrid').addEventListener('click', (e) => {
    const cell = e.target.closest('.day');
    if (!cell) return;
    selectedDate = cell.dataset.date;
    const d = new Date(selectedDate + 'T00:00:00');
    if (d.getMonth() !== viewMonth || d.getFullYear() !== viewYear) {
      viewYear = d.getFullYear(); viewMonth = d.getMonth();
    }
    if (!editingId) $('date').value = selectedDate;
    renderAll();
  });

  $('prev').onclick = () => { viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } renderAll(); };
  $('next').onclick = () => { viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } renderAll(); };
  $('today').onclick = () => {
    const now = new Date();
    viewYear = now.getFullYear(); viewMonth = now.getMonth();
    selectedDate = fmt(now);
    if (!editingId) $('date').value = selectedDate;
    renderAll();
  };

  document.querySelector('.filters').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    filter = b.dataset.filter;
    renderPanel();
  });

  // 디자인 시안 전환
  const savedTheme = localStorage.getItem('wedding-theme') || 'a';
  function applyTheme(t) {
    document.body.className = t === 'a' ? '' : 'theme-' + t;
    $('themeSelect').value = t;
    localStorage.setItem('wedding-theme', t);
  }
  $('themeSelect').addEventListener('change', (e) => applyTheme(e.target.value));
  applyTheme(savedTheme);

  // 초기화
  $('date').value = selectedDate;
  renderAll();
})();
</script>
</body>
</html>
