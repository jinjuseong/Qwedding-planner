<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Wedding 2027.06.05</title>
  <link rel="stylesheet" href="design/tokens.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap">
    <section class="cal">
      <h1 class="big" id="bigDay"></h1>
      <div class="head">
        <div>
          <div class="month" id="month"></div>
          <span class="year" id="year"></span>
        </div>
        <div class="weekday" id="weekday"></div>
      </div>
      <div class="nav">
        <button id="prev" aria-label="이전 달">‹</button>
        <button id="next" aria-label="다음 달">›</button>
      </div>
      <div class="grid" id="dowRow"></div>
      <div class="grid" id="calGrid" style="margin-top:14px"></div>
      <div class="foot">LESS BUT BETTER · D-<span id="dday"></span></div>
    </section>

    <aside class="panel">
      <h2 id="panelTitle"></h2>
      <div class="sub" id="panelSub"></div>
      <div class="bar"><div id="progress" style="width:0"></div></div>

      <div class="filters">
        <button class="btn on" data-f="all">전체</button>
        <button class="btn" data-f="groom">신랑</button>
        <button class="btn" data-f="bride">신부</button>
      </div>

      <form id="todoForm">
        <input id="title" placeholder="할 일 (예: 웨딩홀 계약금 입금)" required>
        <div class="owners">
          <label><input type="radio" name="owner" value="groom" checked>🤵 신랑</label>
          <label><input type="radio" name="owner" value="bride">👰 신부</label>
        </div>
        <div class="row">
          <input type="date" id="date" required>
          <select id="priority">
            <option value="normal">보통</option>
            <option value="high">중요</option>
            <option value="low">여유</option>
          </select>
        </div>
        <textarea id="memo" rows="2" placeholder="메모 (선택)"></textarea>
        <div class="actions">
          <button type="button" class="btn" id="cancelEdit" style="display:none">취소</button>
          <button type="submit" class="btn primary" id="submitBtn">추가</button>
        </div>
      </form>

      <div id="list"></div>
    </aside>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
