<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Wedding 2027.06.05</title>
<style>
  :root {
    --bg: #E9E8E4; --ink: #121412; --mute: #8C8B87; --accent: #F26A21;
    --hollow: #C9C8C4; --panel: #F5F4F1; --line: #DAD9D5;
    --groom: #121412; --bride: #3F7F78;
    --font: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); min-height: 100vh; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 40px 24px; display: grid; grid-template-columns: 1fr 360px; gap: 40px; }
  @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } }

  .cal { max-width: 520px; width: 100%; }
  .big { font-size: 128px; font-weight: 800; line-height: .9; letter-spacing: -5px; margin: 0; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 12px; }
  .month { font-size: 24px; font-weight: 500; text-transform: uppercase; }
  .year { font-size: 24px; color: var(--mute); display: block; }
  .weekday { font-size: 24px; font-weight: 500; }
  .nav { margin: 22px 0 28px; display: flex; gap: 8px; }
  .nav button { background: none; border: 0; color: var(--ink); font-size: 28px; cursor: pointer; padding: 0 12px 0 0; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 14px 12px; justify-items: center; }
  .dow { font-size: 13px; color: var(--mute); }
  .dot { width: 100%; max-width: 52px; aspect-ratio: 1; border-radius: 50%; border: 0; cursor: pointer; background: var(--ink); position: relative; padding: 0; }
  .dot.future { background: transparent; box-shadow: inset 0 0 0 2px var(--hollow); }
  .dot.today { background: var(--accent); }
  .dot.other { opacity: .25; }
  .dot.sel { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--ink); }
  .dot.wed { outline: 2px solid var(--accent); outline-offset: 4px; }
  .dot.has::after { content: ''; position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; transform: translate(-50%, -50%); border-radius: 50%; background: var(--bg); }
  .dot.future.has::after { background: var(--ink); }
  .dot.today.has::after { background: #fff; }
  .foot { text-align: center; letter-spacing: 2px; font-size: 12px; color: var(--mute); margin-top: 48px; }

  .panel { background: var(--panel); border-radius: 20px; padding: 22px; align-self: start; position: sticky; top: 24px; }
  .panel h2 { margin: 0; font-size: 20px; }
  .sub { color: var(--mute); font-size: 13px; margin: 4px 0 12px; }
  .bar { height: 6px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .bar div { height: 100%; background: var(--accent); transition: width .3s; }
  .filters { display: flex; gap: 6px; margin: 16px 0; }
  .btn { border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 7px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; font-family: inherit; }
  .btn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .filters .btn { flex: 1; }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.danger { color: #C94A2A; }
  form { display: grid; gap: 8px; margin-bottom: 14px; }
  input, select, textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-family: inherit; font-size: 14px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .owners { display: flex; gap: 6px; }
  .owners label { flex: 1; text-align: center; padding: 9px; border-radius: 10px; border: 1px solid var(--line); cursor: pointer; font-size: 14px; }
  .owners input { display: none; }
  .owners label:has(input:checked) { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .actions { display: flex; justify-content: flex-end; gap: 6px; }
  .group { font-size: 13px; font-weight: 700; margin: 18px 0 8px; display: flex; align-items: center; gap: 6px; }
  .group i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .todo { display: flex; gap: 10px; padding: 12px; border-radius: 12px; background: var(--bg); margin-bottom: 8px; }
  .todo input[type=checkbox] { width: 16px; height: 16px; margin-top: 3px; accent-color: var(--accent); flex: none; }
  .todo .body { flex: 1; min-width: 0; }
  .todo .title { font-size: 14px; word-break: break-word; }
  .todo.done .title { text-decoration: line-through; color: var(--mute); }
  .todo .meta { font-size: 12px; color: var(--mute); margin-top: 4px; }
  .todo .tools { display: flex; flex-direction: column; gap: 4px; }
  .todo .tools .btn { padding: 4px 9px; font-size: 12px; }
  .empty { color: var(--mute); font-size: 13px; text-align: center; padding: 20px 0; }
  .error { color: #C94A2A; padding: 16px; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <section class="cal">
    <h1 class="big" id="bigDay"></h1>
    <div class="head">
      <div>
        <div class="month" id="month"></div>
        <span class="year" id="year"></span>
      </div>
      <div class="weekday" id="weekday"></div>
    </div>
    <div class="nav">
      <button id="prev" aria-label="이전 달">‹</button>
      <button id="next" aria-label="다음 달">›</button>
    </div>
    <div class="grid" id="dowRow"></div>
    <div class="grid" id="calGrid" style="margin-top:14px"></div>
    <div class="foot">LESS BUT BETTER · D-<span id="dday"></span></div>
  </section>

  <aside class="panel">
    <h2 id="panelTitle"></h2>
    <div class="sub" id="panelSub"></div>
    <div class="bar"><div id="progress" style="width:0"></div></div>

    <div class="filters">
      <button class="btn on" data-f="all">전체</button>
      <button class="btn" data-f="groom">신랑</button>
      <button class="btn" data-f="bride">신부</button>
    </div>

    <form id="todoForm">
      <input id="title" placeholder="할 일 (예: 웨딩홀 계약금 입금)" required>
      <div class="owners">
        <label><input type="radio" name="owner" value="groom" checked>🤵 신랑</label>
        <label><input type="radio" name="owner" value="bride">👰 신부</label>
      </div>
      <div class="row">
        <input type="date" id="date" required>
        <select id="priority">
          <option value="normal">보통</option>
          <option value="high">중요</option>
          <option value="low">여유</option>
        </select>
      </div>
      <textarea id="memo" rows="2" placeholder="메모 (선택)"></textarea>
      <div class="actions">
        <button type="button" class="btn" id="cancelEdit" style="display:none">취소</button>
        <button type="submit" class="btn primary" id="submitBtn">추가</button>
      </div>
    </form>

    <div id="list"></div>
  </aside>
</div>

<script>
(function () {
  try {
    const WEDDING = '2027-06-05';
    const KEY = 'wedding-todos-v2';
    const MONTHS = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
    const DAYS = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
    const DOW = ['M','T','W','T','F','S','S'];

    let todos = [];
    try { todos = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (_) { todos = []; }

    const now = new Date();
    let viewY = now.getFullYear(), viewM = now.getMonth();
    let sel = fmt(now);
    let filter = 'all';
    let editId = null;

    const $ = id => document.getElementById(id);
    const p2 = n => String(n).padStart(2, '0');
    function fmt(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
    function parse(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
    const save = () => localStorage.setItem(KEY, JSON.stringify(todos));
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function render() {
      const today = fmt(new Date());
      const sd = parse(sel);
      $('bigDay').textContent = sd.getDate();
      $('month').textContent = MONTHS[sd.getMonth()];
      $('year').textContent = sd.getFullYear();
      $('weekday').textContent = DAYS[sd.getDay()];
      const diff = Math.round((parse(WEDDING) - parse(today)) / 86400000);
      $('dday').textContent = diff >= 0 ? diff : '0 (D+' + (-diff) + ')';
      $('dowRow').innerHTML = DOW.map(d => `<div class="dow">${d}</div>`).join('');

      const y = viewY, m = viewM;
      const offset = (new Date(y, m, 1).getDay() + 6) % 7;
      const days = new Date(y, m + 1, 0).getDate();
      const total = Math.ceil((offset + days) / 7) * 7;
      let html = '';
      for (let i = 0; i < total; i++) {
        const d = new Date(y, m, 1 - offset + i);
        const ds = fmt(d);
        const cls = ['dot'];
        if (d.getMonth() !== m) cls.push('other');
        if (ds === today) cls.push('today');
        else if (ds > today) cls.push('future');
        if (ds === sel) cls.push('sel');
        if (ds === WEDDING) cls.push('wed');
        if (todos.some(t => t.date === ds)) cls.push('has');
        html += `<button class="${cls.join(' ')}" data-d="${ds}" aria-label="${ds}"></button>`;
      }
      $('calGrid').innerHTML = html;
      renderPanel();
    }

    function renderPanel() {
      const prefix = viewY + '-' + p2(viewM + 1);
      const monthTodos = todos.filter(t => t.date.startsWith(prefix));
      const shown = monthTodos.filter(t => filter === 'all' || t.owner === filter);
      const done = monthTodos.filter(t => t.done).length;
      const pct = monthTodos.length ? Math.round(done / monthTodos.length * 100) : 0;

      $('panelTitle').textContent = (viewM + 1) + '월 할 일';
      $('panelSub').textContent = `완료 ${done} / ${monthTodos.length} (${pct}%)`;
      $('progress').style.width = pct + '%';
      document.querySelectorAll('.filters .btn').forEach(b => b.classList.toggle('on', b.dataset.f === filter));

      const groups = [
        { key: 'groom', label: '🤵 신랑 담당', color: 'var(--groom)' },
        { key: 'bride', label: '👰 신부 담당', color: 'var(--bride)' },
      ].filter(g => filter === 'all' || filter === g.key);

      let out = '';
      groups.forEach(g => {
        const items = shown.filter(t => t.owner === g.key).sort((a, b) => a.date.localeCompare(b.date) || (a.done - b.done));
        if (!items.length) return;
        out += `<div class="group"><i style="background:${g.color}"></i>${g.label} (${items.length})</div>`;
        out += items.map(t => `
          <div class="todo ${t.done ? 'done' : ''}">
            <input type="checkbox" data-act="toggle" data-id="${t.id}" ${t.done ? 'checked' : ''}>
            <div class="body">
              <div class="title">${t.priority === 'high' ? '🔥 ' : ''}${esc(t.title)}</div>
              <div class="meta">${t.date}${t.memo ? ' · ' + esc(t.memo) : ''}</div>
            </div>
            <div class="tools">
              <button class="btn" data-act="edit" data-id="${t.id}">수정</button>
              <button class="btn danger" data-act="delete" data-id="${t.id}">삭제</button>
            </div>
          </div>`).join('');
      });
      $('list').innerHTML = out || '<div class="empty">이번 달 할 일이 없습니다.</div>';
    }

    function resetForm() {
      editId = null;
      $('todoForm').reset();
      $('date').value = sel;
      $('submitBtn').textContent = '추가';
      $('cancelEdit').style.display = 'none';
    }

    $('todoForm').addEventListener('submit', e => {
      e.preventDefault();
      const data = {
        title: $('title').value.trim(),
        owner: document.querySelector('input[name=owner]:checked').value,
        date: $('date').value,
        priority: $('priority').value,
        memo: $('memo').value.trim(),
      };
      if (!data.title || !data.date) return;
      if (editId) {
        const t = todos.find(x => x.id === editId);
        if (t) Object.assign(t, data);
      } else {
        todos.push({ id: uid(), done: false, ...data });
      }
      save();
      sel = data.date;
      const d = parse(sel);
      viewY = d.getFullYear(); viewM = d.getMonth();
      resetForm();
      render();
    });

    $('cancelEdit').addEventListener('click', () => { resetForm(); render(); });

    $('list').addEventListener('click', e => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const id = btn.dataset.id;
      const t = todos.find(x => x.id === id);
      if (!t) return;
      if (btn.dataset.act === 'delete') {
        if (!confirm('이 할 일을 삭제할까요?')) return;
        todos = todos.filter(x => x.id !== id);
        save();
        if (editId === id) resetForm();
        render();
      }
      if (btn.dataset.act === 'edit') {
        editId = id;
        $('title').value = t.title;
        document.querySelector(`input[name=owner][value=${t.owner}]`).checked = true;
        $('date').value = t.date;
        $('priority').value = t.priority;
        $('memo').value = t.memo || '';
        $('submitBtn').textContent = '저장';
        $('cancelEdit').style.display = '';
        $('title').focus();
      }
    });

    $('list').addEventListener('change', e => {
      if (e.target.dataset.act !== 'toggle') return;
      const t = todos.find(x => x.id === e.target.dataset.id);
      if (t) { t.done = e.target.checked; save(); render(); }
    });

    $('calGrid').addEventListener('click', e => {
      const cell = e.target.closest('[data-d]');
      if (!cell) return;
      sel = cell.dataset.d;
      const d = parse(sel);
      viewY = d.getFullYear(); viewM = d.getMonth();
      if (!editId) $('date').value = sel;
      render();
    });

    $('prev').onclick = () => { viewM--; if (viewM < 0) { viewM = 11; viewY--; } render(); };
    $('next').onclick = () => { viewM++; if (viewM > 11) { viewM = 0; viewY++; } render(); };

    document.querySelector('.filters').addEventListener('click', e => {
      const b = e.target.closest('.btn');
      if (!b) return;
      filter = b.dataset.f;
      renderPanel();
    });

    $('date').value = sel;
    render();
  } catch (err) {
    document.querySelector('.wrap').innerHTML = '<div class="error">화면 오류: ' + err.message + '</div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
