<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Wedding Planner</title>
  <meta name="description" content="2027.06.05 아펠가모 광화문 — 결혼 준비 월간 캘린더와 체크리스트">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23e9e8e3'/><text x='32' y='45' font-family='Arial' font-weight='900' font-size='34' text-anchor='middle' fill='%23181917'>W</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app">
    <!-- ============ Main: monthly calendar ============ -->
    <main class="main">
      <header class="cal-header">
        <div>
          <p class="eyebrow">OUR WEDDING PLANNER</p>
          <h1 class="cal-month-ko" id="month-ko"></h1>
        </div>
        <div class="cal-header__right">
          <p class="cal-month-en" id="month-en"></p>
          <p class="cal-year" id="month-year"></p>
          <div class="cal-nav">
            <button class="round-btn" id="prev-month" aria-label="이전 달"><img src="assets/img/icon-prev.svg" width="19" height="19" alt=""></button>
            <button class="round-btn" id="next-month" aria-label="다음 달"><img src="assets/img/icon-next.svg" width="19" height="19" alt=""></button>
          </div>
        </div>
      </header>
      <div class="weekdays" aria-hidden="true">
        <span>SUN</span><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span>
      </div>
      <div class="cal-grid" id="cal-grid" role="grid" aria-label="월간 캘린더"></div>
    </main>

    <!-- ============ Sidebar ============ -->
    <aside class="side">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-monthly" aria-selected="true" aria-controls="panel-monthly">Monthly</button>
        <button class="tab" role="tab" id="tab-total" aria-selected="false" aria-controls="panel-total">Total</button>
      </div>
      <div class="sidebar">
        <section class="panel" id="panel-monthly" role="tabpanel" aria-labelledby="tab-monthly">
          <div class="side-head">
            <div>
              <p class="eyebrow">CHECKLIST</p>
              <h2 class="side-title">Wedding tasks</h2>
            </div>
            <p class="dday" id="dday"></p>
          </div>
          <div class="progress"><i id="progress-bar"></i></div>
          <p class="total-count" id="month-total"></p>
          <div class="stat-row" id="month-stats"></div>
          <div class="filter-row">
            <span class="filter-label" id="month-label"></span>
            <label class="select"><select id="f-day" aria-label="일 필터"></select></label>
            <label class="select"><select id="f-owner-m" aria-label="담당 필터"></select></label>
            <label class="select"><select id="f-status-m" aria-label="상태 필터"></select></label>
          </div>
          <ul class="task-list" id="month-list"></ul>
        </section>

        <section class="panel" id="panel-total" role="tabpanel" aria-labelledby="tab-total" hidden>
          <h2 class="side-title side-title--total">Total</h2>
          <div class="stat-row stat-row--color" id="total-stats"></div>
          <div class="filter-row filter-row--2">
            <label class="select"><select id="f-owner-t" aria-label="담당 필터"></select></label>
            <label class="select"><select id="f-priority-t" aria-label="중요도 필터"></select></label>
          </div>
          <div id="total-list"></div>
        </section>

        <div class="fab-wrap">
          <button class="fab" id="fab" aria-label="할 일 추가"><img src="assets/img/btn-add.svg" width="108" height="108" alt=""></button>
        </div>
      </div>
    </aside>
  </div>

  <!-- 모바일 하단 탭바 -->
  <nav class="bnav" aria-label="화면 전환">
    <button class="bnav__tab" data-tab="monthly" aria-current="page">Monthly</button>
    <button class="bnav__add" id="bnav-add" aria-label="할 일 추가"><img src="assets/img/btn-add.svg" width="60" height="60" alt=""></button>
    <button class="bnav__tab" data-tab="total">Total</button>
  </nav>

  <!-- 할 일 추가 -->
  <dialog class="modal" id="add-dialog" aria-labelledby="add-title">
    <form class="modal__form" id="add-form" method="dialog">
      <h2 id="add-title">할 일 추가</h2>
      <label class="field">제목<input name="title" required maxlength="120"></label>
      <div class="field-row">
        <label class="field">마감일<input type="date" name="due_date"></label>
        <label class="field">담당<select name="owner"></select></label>
      </div>
      <div class="field-row">
        <label class="field">분류<select name="category"></select></label>
        <label class="field">중요도<select name="priority"></select></label>
      </div>
      <label class="field">설명<textarea name="description" rows="3"></textarea></label>
      <div class="modal__actions">
        <button class="btn btn--ghost" value="cancel" formnovalidate>취소</button>
        <button class="btn" value="add">추가</button>
      </div>
    </form>
  </dialog>

  <!-- 로그인 (Supabase 모드) -->
  <dialog class="modal" id="login">
    <form class="modal__form" id="login-form">
      <h2>공동 편집 로그인</h2>
      <p class="muted">등록된 이메일로 로그인 링크를 보내드립니다.</p>
      <input type="email" name="email" required placeholder="you@example.com" autocomplete="email">
      <button class="btn" type="submit">로그인 링크 받기</button>
      <p class="muted" id="login-msg" role="status"></p>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
